name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ADMIN_PASSWORD: Ci-Placeholder-Password-2026!
      ADMIN_COOKIE_SECRET: ci-placeholder-secret-at-least-32-characters
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      RATE_LIMIT_SECRET: ci-placeholder-secret-at-least-32-characters
      OTP_PROOF_SECRET: ci-placeholder-secret-at-least-32-characters
      CRON_SECRET: ci-placeholder-secret-at-least-32-characters
      PAYTR_MERCHANT_ID: ci-placeholder
      PAYTR_MERCHANT_KEY: ci-placeholder
      PAYTR_MERCHANT_SALT: ci-placeholder
      PAYTR_TEST_MODE: "1"
      PAYTR_DEBUG_ON: "0"
      RESEND_API_KEY: ci-placeholder
      RESEND_FROM_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and browser-test against isolated read-only fixtures
        env:
          PHASE0_ADMIN_TEST_SECRET: ci-isolated-admin-secret-2026-at-least-32-characters
          PLAYWRIGHT_BASE_URL: https://127.0.0.1:3443
          PHASE0_ISOLATED: "1"
        run: |
          mkdir -p tmp/local-https-test
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout tmp/local-https-test/key.pem \
            -out tmp/local-https-test/cert.pem \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1'
          node scripts/phase0-fixture-server.mjs tmp/local-https-test/key.pem tmp/local-https-test/cert.pem > /tmp/prestigeso-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "${bridge_pid:-}" "${app_pid:-}" "$fixture_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:54321/__health
          node scripts/phase0-local.mjs build
          node scripts/phase0-local.mjs start > /tmp/prestigeso-next.log 2>&1 &
          app_pid=$!
          node scripts/local-test-https.mjs tmp/local-https-test/key.pem tmp/local-https-test/cert.pem > /tmp/prestigeso-bridge.log 2>&1 &
          bridge_pid=$!
          curl --insecure --retry 20 --retry-connrefused --retry-delay 1 --fail https://127.0.0.1:3443/admin/login > /dev/null
          npm run test:browser

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase start
      - run: supabase test db
